const STORE_KEY='foodWheelRegionsV1',ACTIVE_KEY='foodWheelActiveRegionV1';
let regionStore={},activeRegion='pazhou';
try{regionStore=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{};activeRegion=localStorage.getItem(ACTIVE_KEY)||'pazhou';if(!regionData[activeRegion])activeRegion='pazhou';const legacy=JSON.parse(localStorage.getItem('pazhouWheelShopsV3')||'null');if(!regionStore.pazhou&&Array.isArray(legacy)&&legacy.length>=2)regionStore.pazhou=legacy}catch(e){regionStore={};activeRegion='pazhou'}
function defaultsFor(id=activeRegion){return regionData[id].shops.map(x=>({...x}))}
function storedFor(id=activeRegion){const v=regionStore[id];return Array.isArray(v)&&v.length>=2?v.map(x=>({...x})):defaultsFor(id)}
let shops=storedFor().map((s,i)=>({...s,icon:s.icon||['🍜','🍔','🍗','🥟','🍲'][i%5]}));
let selected=null,rotation=0,spinning=false,lastSector=-1;
function save(){regionStore[activeRegion]=shops;try{localStorage.setItem(STORE_KEY,JSON.stringify(regionStore));localStorage.setItem(ACTIVE_KEY,activeRegion)}catch(e){}updateRegionUI()}
function shortName(s){let t=s.replace(/（.*?）/g,'').replace(/专门店/g,'');return t.length>9?t.slice(0,8)+'…':t}
function draw(){const n=Math.max(shops.length,1),c=450,r=427,arc=Math.PI*2/n;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(c,c);ctx.rotate(rotation);for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,i*arc,(i+1)*arc);ctx.closePath();const g=ctx.createRadialGradient(0,0,50,0,0,r);g.addColorStop(0,palette[i%palette.length]);g.addColorStop(1,palette[(i+1)%palette.length]);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.stroke();ctx.save();ctx.rotate((i+.5)*arc);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.shadowColor='#4e2b3b55';ctx.shadowBlur=5;ctx.font='900 31px sans-serif';ctx.fillText(shops[i]?.icon||'🍽️',r-36,-15);ctx.font='900 26px sans-serif';ctx.fillText(shortName(shops[i]?.name||'请加店铺'),r-35,22);ctx.restore()}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=16;ctx.stroke();ctx.restore()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const box=$('#shopList');box.innerHTML='';shops.forEach((s,i)=>{const el=document.createElement('div');el.className='shop';el.innerHTML=`<span class="emoji">${s.icon||'🍽️'}</span><div><b>${esc(s.name)}</b><span>${esc(s.address||'自定义店铺')}</span></div><button aria-label="移除">移除</button>`;el.querySelector('button').onclick=()=>{if(shops.length<=2)return notify('至少留两家');shops.splice(i,1);save();render();draw()};box.appendChild(el)})}
function notify(text){const t=$('#toast');t.textContent=text;t.classList.add('on');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('on'),1300)}
function updateRegionUI(){const r=regionData[activeRegion];$('#regionSelect').value=activeRegion;$('#manageTitle').textContent=r.name+'的店';$('#tip').textContent=shops.length+' 家候选 · '+r.name+' · 外卖状态请到美团确认'}
function switchRegion(id,located=false){if(!regionData[id]||spinning)return;activeRegion=id;shops=storedFor(id).map((s,i)=>({...s,icon:s.icon||['🍜','🍔','🍗','🥟','🍲'][i%5]}));selected=null;rotation=0;lastSector=-1;$('#quick').classList.remove('show');$('#result').innerHTML='<small>今日待选</small><strong>点一下，马上揭晓</strong>';try{localStorage.setItem(ACTIVE_KEY,id)}catch(e){}updateRegionUI();render();draw();notify((located?'已定位到':'已切换到')+regionData[id].name)}
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function locateRegion(){if(!navigator.geolocation)return notify('当前浏览器不支持定位');notify('正在定位…');navigator.geolocation.getCurrentPosition(pos=>{const a=pos.coords.latitude,b=pos.coords.longitude;let best=null;Object.entries(regionData).forEach(([id,r])=>{const d=km(a,b,r.lat,r.lng);if(!best||d<best.d)best={id,d}});if(!best||best.d>12)return notify('附近暂无内置商圈，请手动选择');switchRegion(best.id,true)},()=>notify('定位失败，请允许定位或手动选择'),{enableHighAccuracy:false,timeout:8000,maximumAge:600000})}

function tick(){const p=$('#pointer');p.classList.remove('tick');void p.offsetWidth;p.classList.add('tick');if(navigator.vibrate)navigator.vibrate(8)}
function confetti(){const rect=$('#hub').getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2;for(let i=0;i<58;i++){const e=document.createElement('i');e.className='confetti';e.style.left=x+'px';e.style.top=y+'px';e.style.background=palette[i%palette.length];const a=Math.random()*Math.PI*2,d=90+Math.random()*230;e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+80+'px');e.style.setProperty('--r',(Math.random()*900-450)+'deg');e.style.animationDelay=Math.random()*.12+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}
function showResult(s){selected=s;const r=$('#result');r.innerHTML=`<small>今天就吃</small><strong>${s.icon||'🍽️'} ${esc(s.name)}</strong>`;r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');$('#quick').classList.add('show');confetti();notify('选好了，正在打开美团…');clearTimeout(autoLaunchTimer);autoLaunchTimer=setTimeout(()=>openMeituan(true),180)}
function spin(){if(spinning||shops.length<2)return;spinning=true;selected=null;$('#quick').classList.remove('show');$('#wheelWrap').classList.add('spinning');$('#spin').textContent='命运转动中…';const n=shops.length,idx=Math.floor(Math.random()*n),arc=Math.PI*2/n,target=-Math.PI/2-(idx+.5)*arc,start=rotation;let end=target+Math.PI*2*(6+Math.floor(Math.random()*3));while(end<start+Math.PI*10)end+=Math.PI*2;const t0=performance.now(),dur=2600;function frame(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);rotation=start+(end-start)*e;draw();const sector=Math.floor((((-rotation-Math.PI/2)%(Math.PI*2))+Math.PI*2)/arc);if(sector!==lastSector&&p<.92){lastSector=sector;tick()}if(p<1)requestAnimationFrame(frame);else{rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);spinning=false;$('#wheelWrap').classList.remove('spinning');$('#spin').textContent='再转一次 🎲';showResult(shops[idx]);if(navigator.vibrate)navigator.vibrate([40,35,90])}}requestAnimationFrame(frame)}
$('#spin').onclick=spin;$('#hub').onclick=spin;
function copySelected(silent=false){if(!selected)return false;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(selected.name).catch(()=>{})}else{const box=document.createElement('textarea');box.value=selected.name;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();document.execCommand('copy');box.remove()}if(!silent)notify('店名已复制');return true}catch(e){if(!silent)prompt('复制店名',selected.name);return false}}
let launchTimer=null,autoLaunchTimer=null;
function showLaunchGuide(){copySelected(true);$('#launchGuide').classList.add('show')}
function openMeituan(auto=false){
 if(!selected)return notify('请先转一次');
 const ua=navigator.userAgent||'';
 const isWechat=/MicroMessenger|wxwork/i.test(ua);
 const isAndroid=/Android/i.test(ua);
 const isIOS=/iPhone|iPad|iPod/i.test(ua);
 if(isWechat){copySelected(true);notify('微信限制唤起，请用浏览器打开');return showLaunchGuide()}
 if(!isAndroid&&!isIOS){copySelected(true);return notify('请用手机打开，店名已复制')}
 if(!auto)copySelected(true);
 const q=encodeURIComponent(regionData[activeRegion].name+' '+selected.name);
 const scheme='imeituan://www.meituan.com/search?q='+q;
 const fallback=encodeURIComponent(window.location.href);
 const target=isAndroid?'intent://www.meituan.com/search?q='+q+'#Intent;scheme=imeituan;package=com.sankuai.meituan;S.browser_fallback_url='+fallback+';end':scheme;
 clearTimeout(launchTimer);
 window.location.href=target;
 launchTimer=setTimeout(()=>{if(document.visibilityState==='visible'){if(auto)copySelected(true);notify('未唤起？请点按钮重试或复制店名')}},1800);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&launchTimer){clearTimeout(launchTimer);launchTimer=null}});
$('#openMeituan').onclick=()=>openMeituan(false);
$('#copy').onclick=()=>copySelected(false);
$('#exclude').onclick=()=>{if(!selected)return;if(shops.length<=2)return notify('至少留两家');shops=shops.filter(s=>s!==selected);selected=null;save();render();draw();$('#quick').classList.remove('show');$('#result').innerHTML='<small>已暂时排除</small><strong>再转一次吧</strong>';notify('这次不吃它')};
$('#closeGuide').onclick=()=>$('#launchGuide').classList.remove('show');$('#launchGuide').onclick=e=>{if(e.target===$('#launchGuide'))$('#launchGuide').classList.remove('show')};
$('#more').onclick=()=>$('#sheetBg').classList.add('open');$('#sheetBg').onclick=e=>{if(e.target===$('#sheetBg'))$('#sheetBg').classList.remove('open')};
function addShop(){const input=$('#newShop'),name=input.value.trim();if(!name)return;if(shops.some(s=>s.name===name))return notify('已经在转盘里');shops.push({name,address:'自定义店铺',icon:['🍜','🍔','🍗','🥟','🍲','🍚'][shops.length%6]});input.value='';save();render();draw();notify('已加入转盘')}
$('#add').onclick=addShop;$('#newShop').onkeydown=e=>{if(e.key==='Enter')addShop()};
$('#reset').onclick=()=>{shops=defaultsFor();selected=null;save();render();draw();$('#quick').classList.remove('show');notify('已恢复'+regionData[activeRegion].name+'默认店铺')};
Object.entries(regionData).forEach(([id,r])=>{const o=document.createElement('option');o.value=id;o.textContent='📍 广州 · '+r.name;$('#regionSelect').appendChild(o)});
$('#regionSelect').onchange=e=>switchRegion(e.target.value);$('#locateBtn').onclick=locateRegion;
updateRegionUI();render();draw();
</script>
</body>
</html>
